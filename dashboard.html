<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | TokoKita Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"','sans-serif']}}}}</script>
</head>
<body class="bg-stone-100 font-sans text-slate-800">
  <div class="flex min-h-screen flex-col md:flex-row">

    <!-- NAVIGASI -->
    <aside class="bg-teal-950 md:w-60 md:shrink-0">
      <div class="px-6 py-5 text-lg font-bold text-white">TokoKita<span class="text-amber-400">.</span></div>
      <nav class="flex gap-1 overflow-x-auto px-3 pb-3 md:flex-col md:pb-0">
        <a href="dashboard.html" class="block rounded-lg px-4 py-2.5 text-sm bg-amber-400 text-teal-950 font-semibold">Dashboard</a>
        <a href="products.html" class="block rounded-lg px-4 py-2.5 text-sm text-teal-100 hover:bg-teal-800">Products</a>
        <a href="#" class="block rounded-lg px-4 py-2.5 text-sm text-teal-100 hover:bg-teal-800">Users</a>
        <a href="#" class="block rounded-lg px-4 py-2.5 text-sm text-teal-100 hover:bg-teal-800">Setting</a>
        <a href="index.html" class="block rounded-lg px-4 py-2.5 text-sm text-red-300 hover:bg-teal-800 md:mt-6">Logout</a>
      </nav>
    </aside>

    <div class="flex min-w-0 flex-1 flex-col">
      <!-- HEADER -->
      <header class="flex items-center justify-between border-b border-stone-200 bg-white px-6 py-4">
        <span class="text-sm text-slate-500">Panel Admin</span>
        <span class="text-sm font-medium">Halo, Admin</span>
      </header>

      <!-- KONTEN UTAMA -->
      <main class="flex-1 p-6">
        <h1 class="text-2xl font-bold">Dashboard</h1>
        <p class="mt-1 text-sm text-slate-500">Ringkasan toko bulan ini.</p>
        <div class="mt-6 grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
          <div class="rounded-xl border-l-4 border-amber-400 bg-white p-5 shadow-sm">
            <p class="text-sm text-slate-500">Total penjualan</p>
            <p class="mt-2 text-2xl font-bold">Rp 48,2 jt</p>
          </div>
          <div class="rounded-xl border-l-4 border-teal-600 bg-white p-5 shadow-sm">
            <p class="text-sm text-slate-500">Pesanan baru</p>
            <p class="mt-2 text-2xl font-bold">126</p>
          </div>
          <div class="rounded-xl border-l-4 border-sky-500 bg-white p-5 shadow-sm">
            <p class="text-sm text-slate-500">Produk aktif</p>
            <p class="mt-2 text-2xl font-bold">342</p>
          </div>
          <div class="rounded-xl border-l-4 border-rose-400 bg-white p-5 shadow-sm">
            <p class="text-sm text-slate-500">Pelanggan terdaftar</p>
            <p class="mt-2 text-2xl font-bold">1.284</p>
          </div>
        </div>
      </main>

      <!-- FOOTER -->
      <footer class="border-t border-stone-200 bg-white px-6 py-4 text-center text-xs text-slate-500">
        &copy; 2026 TokoKita. Tugas Web dengan TailwindCSS.
      </footer>
    </div>
  </div>
</body>
</html>
