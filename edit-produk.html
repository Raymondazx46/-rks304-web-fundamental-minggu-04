<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Produk | TokoKita Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"','sans-serif']}}}}</script>
</head>
<body class="bg-stone-100 font-sans text-slate-800">
  <div class="flex min-h-screen flex-col md:flex-row">

    <!-- NAVIGASI -->
    <aside class="bg-teal-950 md:w-60 md:shrink-0">
      <div class="px-6 py-5 text-lg font-bold text-white">TokoKita<span class="text-amber-400">.</span></div>
      <nav class="flex gap-1 overflow-x-auto px-3 pb-3 md:flex-col md:pb-0">
        <a href="dashboard.html" class="block rounded-lg px-4 py-2.5 text-sm text-teal-100 hover:bg-teal-800">Dashboard</a>
        <a href="products.html" class="block rounded-lg px-4 py-2.5 text-sm bg-amber-400 text-teal-950 font-semibold">Products</a>
        <a href="#" class="block rounded-lg px-4 py-2.5 text-sm text-teal-100 hover:bg-teal-800">Users</a>
        <a href="#" class="block rounded-lg px-4 py-2.5 text-sm text-teal-100 hover:bg-teal-800">Setting</a>
        <a href="index.html" class="block rounded-lg px-4 py-2.5 text-sm text-red-300 hover:bg-teal-800 md:mt-6">Logout</a>
      </nav>
    </aside>

    <div class="flex min-w-0 flex-1 flex-col">
      <!-- HEADER -->
      <header class="flex items-center justify-between border-b border-stone-200 bg-white px-6 py-4">
        <span class="text-sm text-slate-500">Panel Admin</span>
        <span class="text-sm font-medium">Halo, Admin</span>
      </header>

      <!-- KONTEN UTAMA -->
      <main class="flex-1 p-6">
        <h1 class="text-2xl font-bold">Edit Produk</h1>
        <form action="products.html" class="mt-6 max-w-xl space-y-5 rounded-xl bg-white p-6 shadow-sm">
          <div>
            <label for="name" class="mb-1 block text-sm font-medium">Name</label>
            <input id="name" type="text" value="Kaos Polos Hitam" required class="w-full rounded-lg border border-stone-300 px-3 py-2 text-sm focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-200">
          </div>
          <div>
            <label for="stock" class="mb-1 block text-sm font-medium">Stock</label>
            <input id="stock" type="number" min="0" value="120" required class="w-full rounded-lg border border-stone-300 px-3 py-2 text-sm focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-200">
          </div>
          <div>
            <label for="desc" class="mb-1 block text-sm font-medium">Description</label>
            <textarea id="desc" rows="4" class="w-full rounded-lg border border-stone-300 px-3 py-2 text-sm focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-200">Kaos katun combed 30s, nyaman dipakai sehari-hari.</textarea>
          </div>
          <button type="submit" class="rounded-lg bg-teal-800 px-5 py-2 text-sm font-semibold text-white hover:bg-teal-700">Submit</button>
        </form>
      </main>

      <!-- FOOTER -->
      <footer class="border-t border-stone-200 bg-white px-6 py-4 text-center text-xs text-slate-500">
        &copy; 2026 TokoKita. Tugas Web dengan TailwindCSS.
      </footer>
    </div>
  </div>
</body>
</html>
